name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

# This workflow only reads the pushed tag name (via env) and the checked-out
# source. It does not evaluate any event-supplied strings inline in run:
# blocks, so there is no script-injection surface.
#
# Gating: the `publish` job depends on `smoke-test`, which rebuilds and
# imports the module on macOS + Ubuntu on the tagged commit. This replaces
# the need for a cross-workflow `build`-is-green check: if the tagged commit
# cannot build or import, publishing never runs.
jobs:
  validate-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install PowerShell 7.6
        uses: ./.github/actions/install-pwsh76
      - name: Validate committed release metadata before builds and approval
        shell: pwsh
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: ./build/Resolve-Release.ps1 -Tag $env:TAG_NAME

  smoke-test:
    needs: validate-tag
    strategy:
      fail-fast: true
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Install PowerShell 7.6
        uses: ./.github/actions/install-pwsh76

      - name: Show toolchain
        shell: pwsh
        run: |
          Write-Host "pwsh $($PSVersionTable.PSVersion) on $([System.Runtime.InteropServices.RuntimeInformation]::FrameworkDescription)"
          dotnet --version

      - name: Install Microsoft.Online.SharePoint.PowerShell
        shell: pwsh
        run: |
          Install-Module Microsoft.Online.SharePoint.PowerShell `
              -Scope CurrentUser -Force -AllowClobber

      - name: Build native shim
        run: dotnet build -c Release src/SPOService.CrossPlatform/SPOService.CrossPlatform.csproj

      - name: Run module contract tests
        shell: pwsh
        run: ./tests/ModuleContract.Tests.ps1

      - name: Run admin URL contract tests
        shell: pwsh
        run: ./tests/AdminUrl.Tests.ps1

      - name: Run connect binding contract tests
        shell: pwsh
        run: ./tests/ConnectBinding.Tests.ps1

      - name: Run vendor contract tests
        shell: pwsh
        run: ./tests/VendorContract.Tests.ps1

      - name: Run connect failure-path tests
        shell: pwsh
        run: ./tests/ConnectFailure.Tests.ps1

      - name: Run env-file contract tests
        shell: pwsh
        run: ./tests/EnvFile.Tests.ps1

      - name: Run staging contract tests
        shell: pwsh
        run: ./tests/StageModule.Tests.ps1

      - name: Import module (smoke test)
        shell: pwsh
        run: |
          Import-Module ./SPOService.CrossPlatform.psd1 -Force -ErrorAction Stop
          $m = Get-Module SPOService.CrossPlatform
          if (-not $m) { throw 'Module did not load.' }

          foreach ($cmd in 'Connect-SPOServiceCrossPlatform', 'Disconnect-SPOServiceCrossPlatform') {
              if (-not (Get-Command $cmd -ErrorAction SilentlyContinue)) {
                  throw "Expected function missing: $cmd"
              }
          }
          foreach ($alias in 'Connect-SPOService', 'Disconnect-SPOService') {
              $cmd = Get-Command $alias -ErrorAction Stop
              if ($cmd.CommandType -ne 'Alias') {
                  throw "Expected $alias to be an Alias; got $($cmd.CommandType)."
              }
              if ($cmd.ResolvedCommand.Name -notmatch 'CrossPlatform$') {
                  throw "Alias $alias resolves to $($cmd.ResolvedCommand.Name), expected *CrossPlatform."
              }
          }

  publish:
    needs: [validate-tag, smoke-test]
    runs-on: ubuntu-latest
    # Route to the protected environment matching the tag shape:
    #   v1.2.3       -> PSGallery Publishing  (stable)
    #   v1.2.3-beta1 -> PSGallery Prerelease
    # Both environments require approval from @henkas and carry a
    # PSGALLERY_API_KEY secret scoped to the SPOService.CrossPlatform
    # package. The environments' own deployment-branch/tag rules ensure a
    # mis-shaped tag cannot select the wrong environment.
    environment:
      name: ${{ contains(github.ref_name, '-') && 'PSGallery Prerelease' || 'PSGallery Publishing' }}
    env:
      TAG_NAME: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Install PowerShell 7.6
        uses: ./.github/actions/install-pwsh76

      - name: Install Microsoft.Online.SharePoint.PowerShell
        shell: pwsh
        run: |
          Install-Module Microsoft.Online.SharePoint.PowerShell `
              -Scope CurrentUser -Force -AllowClobber

      - name: Resolve release metadata
        id: release
        shell: pwsh
        run: |
          $release = ./build/Resolve-Release.ps1 -Tag $env:TAG_NAME
          $notesPath = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          Set-Content -LiteralPath $notesPath -Value $release.ReleaseNotes -NoNewline -Encoding utf8
          "version=$($release.Version)" >> $env:GITHUB_OUTPUT
          "isPrerelease=$($release.IsPrerelease.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "path=$notesPath" >> $env:GITHUB_OUTPUT
          "hasNotes=$((-not [string]::IsNullOrWhiteSpace($release.ReleaseNotes)).ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Build native shim
        shell: pwsh
        env:
          MODULE_VERSION: ${{ steps.release.outputs.version }}
        run: dotnet build -c Release "/p:Version=$env:MODULE_VERSION" src/SPOService.CrossPlatform/SPOService.CrossPlatform.csproj

      - name: Assemble module package
        shell: pwsh
        run: ./build/Stage-Module.ps1 -OutputPath (Join-Path $env:RUNNER_TEMP 'SPOService.CrossPlatform')

      - name: Validate staged module (Test-ModuleManifest + import)
        shell: pwsh
        run: |
          # Test-ModuleManifest + Import-Module on the staged layout catches
          # problems Publish-Module does not: a missing dot-sourced file, a
          # psm1 runtime error, a DLL probe that fails because bin/net10.0/
          # is misnamed. Running this before PSGallery publish means a
          # broken staged artefact fails the workflow instead of shipping
          # to users.
          $stage = Join-Path $env:RUNNER_TEMP 'SPOService.CrossPlatform'
          $psd1  = Join-Path $stage 'SPOService.CrossPlatform.psd1'

          foreach ($required in 'README.md', 'LICENSE', 'NOTICE', 'bin/net10.0/SPOService.CrossPlatform.dll') {
              if (-not (Test-Path (Join-Path $stage $required))) {
                  throw "Staged module is missing expected path: $required"
              }
          }

          $manifest = Test-ModuleManifest -Path $psd1
          Write-Host ("Test-ModuleManifest: {0} {1} Prerelease='{2}'" -f `
              $manifest.Name, $manifest.Version, $manifest.PrivateData.PSData.Prerelease)

          Import-Module $psd1 -Force -ErrorAction Stop
          foreach ($cmd in 'Connect-SPOServiceCrossPlatform', 'Disconnect-SPOServiceCrossPlatform') {
              if (-not (Get-Command $cmd -ErrorAction SilentlyContinue)) {
                  throw "Staged module missing expected function: $cmd"
              }
          }
          foreach ($alias in 'Connect-SPOService', 'Disconnect-SPOService') {
              $c = Get-Command $alias -ErrorAction Stop
              if ($c.ResolvedCommand.Name -notmatch 'CrossPlatform$') {
                  throw "Staged alias $alias resolves to $($c.ResolvedCommand.Name)."
              }
          }
            Write-Host 'Staged module imports cleanly.'

      - name: Publish to PSGallery
        shell: pwsh
        env:
          PSGALLERY_API_KEY: ${{ secrets.PSGALLERY_API_KEY }}
          RELEASE_NOTES_PATH: ${{ steps.release.outputs.path }}
        run: |
          # Fail loudly if the environment secret is missing. Previously this
          # warned and skipped, which masked a misconfigured environment and
          # shipped a GitHub release with nothing on PSGallery.
          if (-not $env:PSGALLERY_API_KEY) {
              throw "PSGALLERY_API_KEY is not set on the selected environment. Configure it on 'PSGallery Publishing' and 'PSGallery Prerelease' before tagging."
          }
          $stage = Join-Path $env:RUNNER_TEMP 'SPOService.CrossPlatform'
          $publish = @{ Path = $stage; NuGetApiKey = $env:PSGALLERY_API_KEY; Verbose = $true }
          $notes = ([string](Get-Content -LiteralPath $env:RELEASE_NOTES_PATH -Raw)).Trim()
          if (-not [string]::IsNullOrWhiteSpace($notes)) { $publish.ReleaseNotes = $notes }
          Publish-Module @publish

      # Use the preinstalled gh CLI rather than a marketplace action because
      # the enterprise Actions policy restricts third-party actions to those
      # verified by GitHub, and softprops/action-gh-release is not on that
      # allow-list. gh release create is first-party and covers the same
      # surface (notes file / auto-generated notes, prerelease flag, asset
      # upload with a hard fail if the asset is missing).
      #
      # No untrusted event strings are interpolated into run:; TAG_NAME is
      # already validated as semver in the "Resolve release metadata" step upstream, and NOTES_PATH / HAS_NOTES / IS_PRERELEASE
      # are outputs produced by our own steps.
      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN:      ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME:      ${{ github.ref_name }}
          NOTES_PATH:    ${{ steps.release.outputs.path }}
          HAS_NOTES:     ${{ steps.release.outputs.hasNotes }}
          IS_PRERELEASE: ${{ steps.release.outputs.isPrerelease }}
        run: |
          set -euo pipefail
          ASSET="src/SPOService.CrossPlatform/bin/Release/net10.0/SPOService.CrossPlatform.dll"
          if [ ! -f "$ASSET" ]; then
            echo "Expected release asset not found: $ASSET" >&2
            exit 1
          fi

          args=("$TAG_NAME" --title "$TAG_NAME")
          if [ "$HAS_NOTES" = "true" ]; then
            args+=(--notes-file "$NOTES_PATH")
          else
            args+=(--generate-notes)
          fi
          if [ "$IS_PRERELEASE" = "true" ]; then
            args+=(--prerelease)
          fi
          args+=("$ASSET")

          gh release create "${args[@]}"
