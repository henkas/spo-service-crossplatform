name: CodeQL Advanced Code Scanning

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly re-scan so new CodeQL queries catch issues on code that has not
    # changed. Sunday 03:17 UTC, off-peak and outside PR review traffic.
    - cron: '17 3 * * 0'

permissions:
  contents: read
  actions: read
  security-events: write

# Reads only the checkout. CodeQL does not support PowerShell on
# GitHub-hosted runners (supported languages: C/C++, C#, Go, Java/Kotlin,
# JS/TS, Python, Ruby, Swift), so only the native shim is analysed. The
# PowerShell module surface is covered by PSScriptAnalyzer in lint.yml.
jobs:
  analyze:
    name: analyze (csharp)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Install PowerShell 7.6
        uses: ./.github/actions/install-pwsh76

      - name: Install Microsoft.Online.SharePoint.PowerShell
        shell: pwsh
        run: |
          Install-Module Microsoft.Online.SharePoint.PowerShell `
              -Scope CurrentUser -Force -AllowClobber

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9e0d7b8d25671d64c341c19c0152d693099fb5ba # v4.35.5
        with:
          languages: csharp
          build-mode: manual
          # security-and-quality adds quality rules on top of security-extended.
          queries: security-and-quality

      - name: Build native shim
        run: dotnet build -c Release src/SPOService.CrossPlatform/SPOService.CrossPlatform.csproj

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@9e0d7b8d25671d64c341c19c0152d693099fb5ba # v4.35.5
        with:
          category: "/language:csharp"
