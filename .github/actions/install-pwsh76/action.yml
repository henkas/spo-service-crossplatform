name: Install PowerShell 7.6
description: >-
  Installs PowerShell 7.6 into $HOME/pwsh76 and prepends it to PATH so
  subsequent `shell: pwsh` steps resolve to it. GitHub-hosted runners ship
  pwsh 7.4.x by default, but SPOService.CrossPlatform's psd1 requires 7.6+
  at Import-Module time, so the preinstalled pwsh is unusable for the module
  smoke tests.

  This composite action does not read any event-sourced input ($RUNNER_OS,
  $HOME, and $GITHUB_PATH are all runner-provided), so there is no
  script-injection surface.

inputs:
  version:
    description: PowerShell version to install (defaults to 7.6.0).
    required: false
    default: "7.6.0"

runs:
  using: composite
  steps:
    - name: Download and extract pwsh ${{ inputs.version }}
      shell: bash
      env:
        PWSH_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        DEST="$HOME/pwsh76"
        rm -rf "$DEST"
        mkdir -p "$DEST"
        case "$RUNNER_OS" in
          Linux)
            URL="https://github.com/PowerShell/PowerShell/releases/download/v${PWSH_VERSION}/powershell-${PWSH_VERSION}-linux-x64.tar.gz"
            ;;
          macOS)
            if [ "$(uname -m)" = "arm64" ]; then
              URL="https://github.com/PowerShell/PowerShell/releases/download/v${PWSH_VERSION}/powershell-${PWSH_VERSION}-osx-arm64.tar.gz"
            else
              URL="https://github.com/PowerShell/PowerShell/releases/download/v${PWSH_VERSION}/powershell-${PWSH_VERSION}-osx-x64.tar.gz"
            fi
            ;;
          *)
            echo "Unsupported RUNNER_OS: $RUNNER_OS" >&2
            exit 1
            ;;
        esac

        ARCHIVE_NAME="$(basename "$URL")"
        ARCHIVE_PATH="$RUNNER_TEMP/$ARCHIVE_NAME"
        CHECKSUMS_URL="https://github.com/PowerShell/PowerShell/releases/download/v${PWSH_VERSION}/hashes.sha256"
        CHECKSUMS_PATH="$RUNNER_TEMP/powershell-${PWSH_VERSION}-hashes.sha256"
        CHECKSUMS_UTF8_PATH="$RUNNER_TEMP/powershell-${PWSH_VERSION}-hashes.utf8.sha256"

        curl -fsSL -o "$ARCHIVE_PATH" "$URL"
        curl -fsSL -o "$CHECKSUMS_PATH" "$CHECKSUMS_URL"

        # PowerShell's release checksum file is UTF-16LE and prefixes filenames
        # with '*', so normalize it to UTF-8 before matching the selected asset.
        iconv -f UTF-16LE -t UTF-8 "$CHECKSUMS_PATH" | tr -d '\r' > "$CHECKSUMS_UTF8_PATH"
        EXPECTED_HASH="$(awk -v archive="$ARCHIVE_NAME" '$2 { sub(/^\*/, "", $2); if ($2 == archive) { print $1; exit } }' "$CHECKSUMS_UTF8_PATH")"
        if [ -z "$EXPECTED_HASH" ]; then
          echo "Failed to find SHA256 for $ARCHIVE_NAME in $CHECKSUMS_URL" >&2
          exit 1
        fi

        if command -v sha256sum >/dev/null 2>&1; then
          ACTUAL_HASH="$(sha256sum "$ARCHIVE_PATH" | awk '{print $1}')"
        else
          ACTUAL_HASH="$(shasum -a 256 "$ARCHIVE_PATH" | awk '{print $1}')"
        fi

        if [ "$ACTUAL_HASH" != "$EXPECTED_HASH" ]; then
          echo "SHA256 mismatch for $ARCHIVE_NAME" >&2
          echo "Expected: $EXPECTED_HASH" >&2
          echo "Actual:   $ACTUAL_HASH" >&2
          exit 1
        fi

        tar -xzf "$ARCHIVE_PATH" -C "$DEST"
        chmod +x "$DEST/pwsh"
        echo "$DEST" >> "$GITHUB_PATH"

    - name: Verify pwsh ${{ inputs.version }} on PATH
      shell: pwsh
      env:
        PWSH_EXPECTED_VERSION: ${{ inputs.version }}
      run: |
        $v = $PSVersionTable.PSVersion
        Write-Host "pwsh $v at $((Get-Command pwsh).Source)"
        if ($v -lt [version]$env:PWSH_EXPECTED_VERSION) {
            throw "pwsh $v is below required $env:PWSH_EXPECTED_VERSION"
        }
